# TEMPORAER: sucht die Quelle der Kanal-Gesamtaufrufe und legt Bericht und
# Fixture auf diesem Branch ab. Wird vor dem Pull Request geloescht.
name: Fixture holen (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: Suchen und Bericht schreiben
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          HEAD = {"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9",
                  "Cookie": "CONSENT=YES+1"}
          report = []

          def say(*parts):
              line = " ".join(str(p) for p in parts)
              report.append(line)
              print(line)

          req = urllib.request.Request("https://www.youtube.com/@spacefactswow?hl=en", headers=HEAD)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "ignore")
          api_key = re.search(r'"INNERTUBE_API_KEY":"([^"]+)"', html).group(1)
          channel = re.search(r'"(?:externalId|browseId)":"(UC[\w-]{20,})"', html).group(1)
          version = re.search(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"', html).group(1)
          say("Kanal", channel, "Client", version, "HTML", len(html))

          # 1) Continuation-Token fuer den About-Panel im Seitenquelltext.
          tokens = re.findall(r'"continuationCommand":\{"token":"([^"]{20,})","request":"CONTINUATION_REQUEST_TYPE_([A-Z_]+)"', html)
          say("Continuation-Tokens im HTML:", len(tokens),
              [t[1] for t in tokens][:8])
          panel_ids = sorted(set(re.findall(r'"(?:targetId|panelIdentifier)":"([^"]{3,60})"', html)))
          say("Panel-Kennungen:", panel_ids[:12])

          def browse(payload):
              body = {"context": {"client": {"clientName": "WEB", "clientVersion": version,
                                             "hl": "en", "gl": "US"}}}
              body.update(payload)
              req = urllib.request.Request(
                  "https://www.youtube.com/youtubei/v1/browse?key=" + api_key,
                  data=json.dumps(body).encode("utf-8"),
                  headers=dict(HEAD, **{"Content-Type": "application/json"}))
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          def zahlen(raw, label):
              treffer = re.findall(r'"([A-Za-z]*[Cc]ount[A-Za-z]*|[A-Za-z]*[Vv]iew[A-Za-z]*)":"([^"]{1,40})"', raw)
              gefiltert = [(k, v) for k, v in treffer
                           if re.search(r"\d", v) and len(v) < 40]
              say("\n[%s] Laenge %d, Zahlfelder %d" % (label, len(raw), len(gefiltert)))
              seen = set()
              for k, v in gefiltert:
                  if (k, v) in seen:
                      continue
                  seen.add((k, v))
                  say("   ", k, "=", repr(v))
                  if len(seen) > 25:
                      break
              for m in list(re.finditer(r'"[^"]{0,30}[\d,\.]+ (?:views|subscribers|videos)[^"]{0,20}"', raw))[:12]:
                  say("   Text:", m.group(0))
              return raw

          versuche = [
              ("about-params", {"browseId": channel, "params": "EgVhYm91dA=="}),
              ("kanal-roh", {"browseId": channel}),
          ]
          for t, kind in tokens[:6]:
              if kind in ("BROWSE", "RELOAD", "WATCH_NEXT"):
                  continue
              versuche.append(("continuation-" + kind, {"continuation": t}))

          gewinner = None
          for label, payload in versuche:
              try:
                  raw = browse(payload)
              except Exception as e:
                  say("\n[%s] FEHLER %r" % (label, e))
                  continue
              zahlen(raw, label)
              if "aboutChannelViewModel" in raw and gewinner is None:
                  gewinner = (label, raw)
                  say("   >>> aboutChannelViewModel gefunden in", label)

          out_dir = pathlib.Path("tests/fixtures")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "_probe_bericht.txt").write_text("\n".join(report), encoding="utf-8")

          if gewinner:
              label, raw = gewinner
              obj = json.loads(raw)

              def find(node, key, path=()):
                  if isinstance(node, dict):
                      for k, v in node.items():
                          if k == key:
                              return path + (k,), v
                          hit = find(v, key, path + (k,))
                          if hit:
                              return hit
                  elif isinstance(node, list):
                      for i, v in enumerate(node):
                          hit = find(v, key, path + (i,))
                          if hit:
                              return hit
                  return None

              path, block = find(obj, "aboutChannelViewModel")
              value = block
              for step in reversed(path[:-1]):
                  value = {step: value} if isinstance(step, str) else [value]
              full = {path[-1]: value} if len(path) == 1 else value
              (out_dir / "youtube_about_2026-09-05.json").write_text(
                  json.dumps(full, ensure_ascii=False, indent=1), encoding="utf-8")
              say("Fixture geschrieben, Pfad im JSON:", path)
              (out_dir / "_probe_bericht.txt").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Bericht und Fixture committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/fixtures/
          git commit -m "Setup: Probe-Bericht und Fixture vom Runner" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
