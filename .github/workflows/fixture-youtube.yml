# TEMPORAER: prueft den neuen YouTube-Abruf einmal gegen die echte Seite,
# ohne docs/data.json anzufassen. Wird danach geloescht.
name: Fixture holen (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: Echten Abruf pruefen
        run: |
          python3 - <<'PY'
          import pathlib
          import update

          werte = update.get_youtube("spacefactswow")
          zeile = "Live-Abruf get_youtube: %r" % (werte,)
          print(zeile)
          pathlib.Path("tests/fixtures/_probe_bericht.txt").write_text(zeile, encoding="utf-8")
          PY

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/fixtures/_probe_bericht.txt
          git commit -m "Setup: Ergebnis des Live-Abrufs" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
