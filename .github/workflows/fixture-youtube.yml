# TEMPORAER: holt den About-Block des Kanals ueber den Innertube-Aufruf und
# legt ihn als kleine, gueltige JSON-Fixture auf diesem Branch ab.
# Wird vor dem Pull Request geloescht.
name: Fixture holen (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: About-Block holen
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          HEAD = {"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9",
                  "Cookie": "CONSENT=YES+1"}

          req = urllib.request.Request("https://www.youtube.com/@spacefactswow?hl=en", headers=HEAD)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "ignore")
          api_key = re.search(r'"INNERTUBE_API_KEY":"([^"]+)"', html).group(1)
          channel = re.search(r'"(?:externalId|browseId)":"(UC[\w-]{20,})"', html).group(1)
          version = re.search(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"', html).group(1)
          print("Kanal:", channel, "Client:", version)

          def browse(params):
              body = {"context": {"client": {"clientName": "WEB", "clientVersion": version,
                                             "hl": "en", "gl": "US"}},
                      "browseId": channel, "params": params}
              req = urllib.request.Request(
                  "https://www.youtube.com/youtubei/v1/browse?key=" + api_key,
                  data=json.dumps(body).encode("utf-8"),
                  headers=dict(HEAD, **{"Content-Type": "application/json"}))
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8", "ignore"))

          def find(node, key, path=()):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == key:
                          return path + (k,), v
                      hit = find(v, key, path + (k,))
                      if hit:
                          return hit
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      hit = find(v, key, path + (i,))
                      if hit:
                          return hit
              return None

          def rebuild(path, value):
              # Baut den Pfad wieder auf, Listen als einelementige Listen.
              for step in reversed(path[:-1]):
                  value = {step: value} if isinstance(step, str) else [value]
              return {path[-1]: value} if len(path) == 1 else value

          data = None
          for params in ("EgVhYm91dPIGBAoCEgA=", "EgVhYm91dA=="):
              try:
                  data = browse(params)
              except Exception as e:
                  print("Aufruf FEHLER", params, repr(e))
                  continue
              hit = find(data, "aboutChannelViewModel")
              print("params", params, "-> aboutChannelViewModel:", bool(hit))
              if hit:
                  path, block = hit
                  print("Pfad:", path)
                  print("Block:", json.dumps(block, ensure_ascii=False)[:900])
                  full = rebuild(path, block)
                  out = pathlib.Path("tests/fixtures/youtube_about_2026-09-05.json")
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text(json.dumps(full, ensure_ascii=False, indent=1), encoding="utf-8")
                  print("Fixture:", out, out.stat().st_size, "Bytes")
                  break
          else:
              print("Kein About-Block gefunden.")
              if data:
                  print("Top-Level:", list(data.keys()))
          PY

      - name: Fixture committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/fixtures/
          git commit -m "Setup: YouTube-About-Fixture vom Runner geholt" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
