# TEMPORAER: sucht die Quelle der Kanal-Gesamtaufrufe und legt Bericht und
# Fixture auf diesem Branch ab. Wird vor dem Pull Request geloescht.
name: Fixture holen (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: Suchen und Bericht schreiben
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          HEAD = {"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9",
                  "Cookie": "CONSENT=YES+1"}
          report = []

          def say(*parts):
              line = " ".join(str(p) for p in parts)
              report.append(line)
              print(line)

          def sichern():
              d = pathlib.Path("tests/fixtures")
              d.mkdir(parents=True, exist_ok=True)
              (d / "_probe_bericht.txt").write_text("\n".join(report), encoding="utf-8")
              return d

          req = urllib.request.Request("https://www.youtube.com/@spacefactswow?hl=en", headers=HEAD)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "ignore")
          api_key = re.search(r'"INNERTUBE_API_KEY":"([^"]+)"', html).group(1)
          channel = re.search(r'"(?:externalId|browseId)":"(UC[\w-]{20,})"', html).group(1)
          version = re.search(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"', html).group(1)
          visitor = re.search(r'"visitorData":"([^"]+)"', html)
          visitor = visitor.group(1) if visitor else None
          say("Kanal", channel, "Client", version, "visitorData:", bool(visitor))

          def browse(payload, mit_visitor=True):
              client = {"clientName": "WEB", "clientVersion": version, "hl": "en", "gl": "US"}
              if mit_visitor and visitor:
                  client["visitorData"] = visitor
              body = {"context": {"client": client}}
              body.update(payload)
              headers = dict(HEAD, **{
                  "Content-Type": "application/json",
                  "X-YouTube-Client-Name": "1",
                  "X-YouTube-Client-Version": version,
                  "Origin": "https://www.youtube.com",
                  "Referer": "https://www.youtube.com/@spacefactswow",
              })
              if mit_visitor and visitor:
                  headers["X-Goog-Visitor-Id"] = visitor
              req = urllib.request.Request(
                  "https://www.youtube.com/youtubei/v1/browse?key=" + api_key + "&prettyPrint=false",
                  data=json.dumps(body).encode("utf-8"), headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          versuche = [
              ("about-roh", {"browseId": channel, "params": "EgVhYm91dPIGBAoCEgA="}),
              ("about-kodiert", {"browseId": channel, "params": "EgVhYm91dPIGBAoCEgA%3D"}),
              ("about-kurz", {"browseId": channel, "params": "EgVhYm91dA=="}),
          ]
          gewinner = None
          for label, payload in versuche:
              try:
                  raw = browse(payload)
              except Exception as e:
                  say("[%s] FEHLER %r" % (label, e))
                  continue
              hat = "aboutChannelViewModel" in raw
              top = list(json.loads(raw).keys())
              say("[%s] Laenge %d, aboutChannelViewModel: %s, Top-Level: %s"
                  % (label, len(raw), hat, top))
              for m in list(re.finditer(r'"[\d,\.]+ views"', raw))[:3]:
                  say("    ", m.group(0))
              if hat and gewinner is None:
                  gewinner = (label, raw)

          # Vergleichswert: Summe der Aufrufe aller Videos ueber den Videos-Tab.
          summe, anzahl, cont = 0, 0, None
          raw = browse({"browseId": channel, "params": "EgZ2aWRlb3PyBgQKAjoA"})
          for runde in range(8):
              werte = re.findall(r'"([\d,\.]+) views"', raw)
              for w in werte:
                  try:
                      summe += int(w.replace(",", "").replace(".", ""))
                      anzahl += 1
                  except ValueError:
                      pass
              m = re.search(r'"continuationCommand":\{"token":"([^"]+)"', raw)
              if not m:
                  break
              try:
                  raw = browse({"continuation": m.group(1)})
              except Exception as e:
                  say("Continuation FEHLER", repr(e))
                  break
          say("Videos-Tab: %d Videos gezaehlt, Summe der Aufrufe %d" % (anzahl, summe))

          d = sichern()
          if gewinner:
              label, raw = gewinner
              obj = json.loads(raw)

              def find(node, key, path=()):
                  if isinstance(node, dict):
                      for k, v in node.items():
                          if k == key:
                              return path + (k,), v
                          hit = find(v, key, path + (k,))
                          if hit:
                              return hit
                  elif isinstance(node, list):
                      for i, v in enumerate(node):
                          hit = find(v, key, path + (i,))
                          if hit:
                              return hit
                  return None

              path, block = find(obj, "aboutChannelViewModel")
              value = block
              for step in reversed(path[:-1]):
                  value = {step: value} if isinstance(step, str) else [value]
              full = {path[-1]: value} if len(path) == 1 else value
              (d / "youtube_about_2026-09-05.json").write_text(
                  json.dumps(full, ensure_ascii=False, indent=1), encoding="utf-8")
              say("Fixture geschrieben aus", label, "Pfad", path)
              sichern()
          PY

      - name: Bericht und Fixture committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/fixtures/
          git commit -m "Setup: Probe-Bericht und Fixture vom Runner" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
