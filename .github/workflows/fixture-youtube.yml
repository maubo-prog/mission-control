# TEMPORAER: holt einmalig die YouTube-About-Seite, kuerzt sie auf den
# Kanal-Block, schwaerzt Tokens und committet die Fixture auf diesen Branch.
# Wird vor dem Pull Request wieder geloescht.
name: Fixture holen (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: About-Seite holen, kuerzen, schwaerzen
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          html = ""
          for url in ("https://www.youtube.com/@spacefactswow/about",
                      "https://www.youtube.com/@spacefactswow"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept-Language": "en-US,en;q=0.9",
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Cookie": "CONSENT=YES+1",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      html = r.read().decode("utf-8", "ignore")
                  print("Quelle:", url, "Laenge:", len(html))
                  break
              except Exception as e:
                  print("FEHLER", url, repr(e))
          if not html:
              raise SystemExit("keine Seite bekommen")

          # Ausschnitt um den Kanal-Block. Reihenfolge = Verlaesslichkeit.
          anchor = -1
          for key in ("aboutChannelViewModel", "channelAboutFullMetadataRenderer",
                      "subscriberCountText", "videoCountText"):
              anchor = html.find(key)
              if anchor >= 0:
                  print("Anker:", key, "bei", anchor)
                  break
          if anchor < 0:
              raise SystemExit("kein Anker in der Seite, vermutlich Bot-Sperre")

          head = html[:1200]
          body = html[max(0, anchor - 4000):anchor + 24000]
          cut = head + "\n<!-- gekuerzt fuer die Fixture -->\n" + body

          # Tokens und Sitzungskennungen schwaerzen.
          for key in ("visitorData", "ID_TOKEN", "INNERTUBE_API_KEY", "sessionId",
                      "datasyncId", "delegatedSessionId", "serializedExperimentIds",
                      "VISITOR_DATA", "eventId", "csn"):
              cut = re.sub(r'("%s"\s*:\s*")[^"]*(")' % key, r"\1GESCHWAERZT\2", cut)
          cut = re.sub(r"(?i)(set-cookie)[^\n]*", r"\1: GESCHWAERZT", cut)

          out = pathlib.Path("tests/fixtures/youtube_about_2026-09-05.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(cut, encoding="utf-8")
          print("Fixture:", out, len(cut), "Zeichen")

          # Kompakte Uebersicht fuer das Log, damit die Zielzahl sichtbar ist.
          print("\n--- Kandidaten fuer die Kanal-Views ---")
          for m in list(re.finditer(r'"viewCountText"\s*:\s*("[^"]{0,60}"|\{[^}]{0,120}\})', cut))[:6]:
              print(repr(m.group(0)))
          for m in list(re.finditer(r'"(subscriberCountText|videoCountText|joinedDateText)"\s*:\s*("[^"]{0,60}"|\{[^}]{0,160}\})', cut))[:6]:
              print(repr(m.group(0)))
          print("\n--- erste sechs 'views' im gekuerzten Ausschnitt ---")
          for m in list(re.finditer(r"[\d.,]+\s*(?:views|Aufrufe)", cut))[:6]:
              print(repr(cut[max(0, m.start() - 70):m.end() + 10]))
          PY

      - name: Fixture committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/youtube_about_2026-09-05.html
          git commit -m "Setup: YouTube-Fixture vom Runner geholt" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
