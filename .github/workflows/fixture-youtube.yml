# TEMPORAER: sucht die Quelle fuer die Kanal-Gesamtaufrufe und legt die
# passende Fixture auf diesem Branch ab. Wird vor dem Pull Request geloescht.
name: Fixture holen (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: Quelle der Kanal-Views suchen
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          HEAD = {"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9",
                  "Cookie": "CONSENT=YES+1"}

          def get(url):
              req = urllib.request.Request(url, headers=HEAD)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          html = get("https://www.youtube.com/@spacefactswow?hl=en")
          print("Seite geladen, Laenge", len(html))

          # A) Steht die Kanalsumme irgendwo im vollen Quelltext?
          for key in ("viewCountText", "aboutChannelViewModel", "channelAboutFullMetadataRenderer"):
              hits = [m.start() for m in re.finditer(re.escape(key), html)]
              print("\nA) %s: %d Treffer" % (key, len(hits)))
              for pos in hits[:2]:
                  print("   ", repr(html[pos:pos + 160]))

          key_m = re.search(r'"INNERTUBE_API_KEY":"([^"]+)"', html)
          ch_m = re.search(r'"(?:externalId|browseId)":"(UC[\w-]{20,})"', html)
          ver_m = re.search(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"', html)
          print("\nAPI-Key gefunden:", bool(key_m), "Kanal-ID:", ch_m.group(1) if ch_m else None,
                "Client:", ver_m.group(1) if ver_m else None)

          # B) Innertube-Aufruf fuer den About-Tab.
          data = None
          if key_m and ch_m:
              body = {
                  "context": {"client": {"clientName": "WEB",
                                         "clientVersion": ver_m.group(1) if ver_m else "2.20240101.00.00",
                                         "hl": "en", "gl": "US"}},
                  "browseId": ch_m.group(1),
                  "params": "EgVhYm91dPIGBAoCEgA%3D",
              }
              req = urllib.request.Request(
                  "https://www.youtube.com/youtubei/v1/browse?key=" + key_m.group(1),
                  data=json.dumps(body).encode("utf-8"),
                  headers=dict(HEAD, **{"Content-Type": "application/json"}))
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode("utf-8", "ignore")
                  print("\nB) Innertube OK, Laenge", len(raw))
                  for key in ("viewCountText", "aboutChannelViewModel", "subscriberCountText",
                              "videoCountText", "joinedDateText"):
                      for m in list(re.finditer(re.escape(key), raw))[:2]:
                          print("   ", repr(raw[m.start():m.start() + 200]))
                  data = raw
              except Exception as e:
                  print("\nB) Innertube FEHLER", repr(e))

          if data:
              red = data
              for key in ("visitorData", "ID_TOKEN", "sessionId", "datasyncId",
                          "delegatedSessionId", "trackingParams", "clickTrackingParams"):
                  red = re.sub(r'("%s"\s*:\s*")[^"]*(")' % key, r"\1GESCHWAERZT\2", red)
              try:
                  obj = json.loads(red)
                  red = json.dumps(obj, ensure_ascii=False)[:45000]
              except Exception:
                  red = red[:45000]
              out = pathlib.Path("tests/fixtures/youtube_about_2026-09-05.json")
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(red, encoding="utf-8")
              print("\nFixture geschrieben:", out, len(red), "Zeichen")
          PY

      - name: Fixture committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch tests/fixtures/youtube_about_2026-09-05.html
          rm -f tests/fixtures/youtube_about_2026-09-05.html
          git add -A tests/fixtures/
          git commit -m "Setup: YouTube-About-Fixture vom Runner geholt" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
