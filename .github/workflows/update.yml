name: Zahlen aktualisieren

on:
  schedule:
    - cron: "30 4 * * *"   # taeglich 04:30 UTC = 06:30 deutsche Sommerzeit
  workflow_dispatch: {}     # erlaubt manuellen Start per Knopf

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zahlen holen
        run: python update.py

      - name: Speichern
        run: |
          git config user.name "mission-control-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Stats $(date -u +%F)"
          git push
