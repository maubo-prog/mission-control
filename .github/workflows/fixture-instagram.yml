# TEMPORAER: prueft, ob Instagram die Followerzahl noch ohne Login ausliefert,
# und legt Bericht und Fixture auf diesem Branch ab. Wird vor dem PR geloescht.
name: Instagram-Fixture (temporaer)

on:
  push:
    branches:
      - claude/briefing-h9gjow

permissions:
  contents: write

concurrency:
  group: instagram-fixture
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/briefing-h9gjow

      - name: Quellen pruefen
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          H = "spacefactswow"
          report, fixtures = [], {}

          def say(*p):
              line = " ".join(str(x) for x in p)
              report.append(line)
              print(line)

          def get(url, headers=None, timeout=25):
              req = urllib.request.Request(url, headers=dict({"User-Agent": UA,
                  "Accept-Language": "en-US,en;q=0.9", "Accept": "*/*"}, **(headers or {})))
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.geturl(), r.read().decode("utf-8", "ignore")

          def redact(text):
              for key in ("csrf_token", "sessionid", "ds_user_id", "mid", "ig_did", "rur",
                          "device_id", "machine_id", "LSD", "lsd", "__spin_", "__hsi", "__rev",
                          "haste_session", "fb_dtsg", "jazoest", "server_revision"):
                  text = re.sub(r'("%s"\s*:\s*")[^"]*(")' % re.escape(key), r"\1GESCHWAERZT\2", text)
              text = re.sub(r"(?i)(set-cookie:)[^\n]*", r"\1 GESCHWAERZT", text)
              return text

          def zahlen(text):
              out = []
              for m in re.finditer(r'"edge_followed_by"\s*:\s*\{\s*"count"\s*:\s*(\d+)', text):
                  out.append(("edge_followed_by", m.group(1)))
              for m in re.finditer(r'"follower_count"\s*:\s*(\d+)', text):
                  out.append(("follower_count", m.group(1)))
              for m in re.finditer(r'content="([^"]{0,80}?Followers[^"]{0,120})"', text):
                  out.append(("meta", m.group(1)))
              for m in re.finditer(r'([\d.,]+[KM]?)\s*Followers', text):
                  out.append(("text", m.group(1)))
              return out[:8]

          versuche = [
              ("json-endpunkt",
               "https://i.instagram.com/api/v1/users/web_profile_info/?username=" + H,
               {"x-ig-app-id": "936619743392459", "Referer": "https://www.instagram.com/"}),
              ("www-json",
               "https://www.instagram.com/api/v1/users/web_profile_info/?username=" + H,
               {"x-ig-app-id": "936619743392459", "Referer": "https://www.instagram.com/"}),
              ("profilseite", "https://www.instagram.com/" + H + "/", {}),
              ("profilseite-embed", "https://www.instagram.com/" + H + "/embed/", {}),
              ("lese-proxy", "https://r.jina.ai/https://www.instagram.com/" + H + "/", {}),
          ]
          for label, url, headers in versuche:
              try:
                  status, final, text = get(url, headers, timeout=40 if "jina" in url else 25)
              except Exception as e:
                  say("[%s] FEHLER %r" % (label, e))
                  continue
              login = "accounts/login" in final or 'login' in final.lower()
              say("[%s] Status %d, Laenge %d, Weiterleitung auf Login: %s" % (label, status, len(text), login))
              say("   Endadresse:", final[:100])
              treffer = zahlen(text)
              say("   Zahlen:", treffer if treffer else "keine")
              if treffer:
                  fixtures[label] = redact(text)

          d = pathlib.Path("tests/fixtures")
          d.mkdir(parents=True, exist_ok=True)
          for label, text in fixtures.items():
              # Nur den Ausschnitt um den ersten Treffer sichern, unter 50 KB.
              m = re.search(r'edge_followed_by|follower_count|Followers', text)
              start = max(0, m.start() - 3000) if m else 0
              cut = text[start:start + 30000]
              ext = "json" if label.endswith("json") or label == "json-endpunkt" else "html"
              ziel = d / ("instagram_%s_2026-09-05.%s" % (label.replace("-", "_"), ext))
              ziel.write_text(cut, encoding="utf-8")
              say("Fixture:", ziel, ziel.stat().st_size, "Bytes")
          (d / "_probe_instagram.txt").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Bericht committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/fixtures/
          git commit -m "Setup: Instagram-Probe vom Runner" || echo "nichts zu committen"
          git push origin HEAD:claude/briefing-h9gjow
