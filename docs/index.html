<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>@spacefactswow · Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#070A14; --panel:#0E1322; --panelSoft:#151B30; --line:#222B47;
    --text:#EEF0F8; --dim:#8A93B5; --faint:#5A6383;
    --yellow:#FFEC00; --green:#4ADE80; --red:#F87171;
    --tiktok:#25F4EE; --youtube:#FF5A5A; --instagram:#F06292;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    background-image:
      radial-gradient(1px 1px at 15% 12%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 78% 6%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 60% 22%, rgba(255,255,255,.22), transparent),
      radial-gradient(1px 1px at 32% 45%, rgba(255,255,255,.18), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,.22), transparent),
      radial-gradient(1.5px 1.5px at 45% 82%, rgba(255,255,255,.16), transparent);
  }
  .wrap{max-width:440px;margin:0 auto;padding:20px 14px 40px}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:800;font-size:10px;
    letter-spacing:2.5px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .eyebrow.y{color:var(--yellow)}
  h1{margin:4px 0 0;font-family:'Montserrat',sans-serif;font-weight:900;font-size:27px;
    line-height:1.1;color:var(--yellow);text-shadow:2.5px 2.5px 0 #000;letter-spacing:.3px}
  .sub{margin-top:8px;font-size:13px;color:var(--dim)}
  .sub b{color:var(--text)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px}
  .card.mission{background:var(--panelSoft);border-color:#3A3410}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .row .lbl{font-size:12px;color:var(--dim)}
  .row .val{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px}
  .row .val small{color:var(--faint);font-weight:400}
  .bar{position:relative;height:12px;border-radius:999px;background:#0A0F1D;border:1px solid var(--line)}
  .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;opacity:.9;transition:width .5s ease}
  .bar .rocket{position:absolute;top:-7px;font-size:15px;transition:left .5s ease;
    filter:drop-shadow(0 0 4px rgba(255,236,0,.6))}
  .note{margin-top:8px;font-size:11px;color:var(--faint);line-height:1.5}
  .note b{color:var(--text)} .note .y{color:var(--yellow)}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .phead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .dot{width:8px;height:8px;border-radius:99px}
  .pname{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;letter-spacing:.5px}
  .likes{margin-left:auto;font-size:11px;color:var(--faint)}
  .cols{display:flex;gap:12px}
  .col{flex:1}
  .vline{width:1px;background:var(--line)}
  .klbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .big{font-family:'Montserrat',sans-serif;font-weight:900;font-size:24px;line-height:1}
  .chip{font-size:12px;font-weight:600;margin-top:4px;display:inline-block}
  .up{color:var(--green)} .down{color:var(--red)} .zero{color:var(--faint)}
  .btn{width:100%;background:var(--yellow);color:#0A0A0A;font-family:'Montserrat',sans-serif;
    font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;
    padding:15px 12px;border:none;border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 #000}
  .ghost{width:100%;background:transparent;color:var(--dim);font-size:13px;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-top:8px}
  input{width:100%;background:#0A0F1D;border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:10px 12px;font-size:16px;font-family:'Inter',sans-serif;outline:none}
  input::placeholder{color:#4A5273}
  button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .hist{display:flex;align-items:center;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:13px}
  .hist .d{color:var(--dim);width:52px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;
    font-size:11px;font-weight:600;padding:4px 10px;cursor:pointer}
  .tab.on{border-color:var(--yellow);background:rgba(255,236,0,.12);color:var(--yellow)}
  .footer{text-align:center;font-size:10px;color:var(--faint);margin-top:4px;letter-spacing:1px}
  .err{background:#2A1420;border:1px solid #7F1D3A;color:#FCA5C0;border-radius:12px;
    padding:10px 12px;font-size:13px;margin-bottom:12px}
  .hidden{display:none}
  svg text{font-family:'Inter',sans-serif}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="eyebrow" style="margin:0">Mission Control</div>
    <div id="stand" style="font-size:11px;color:var(--faint)"></div>
  </div>
  <h1>@spacefactswow</h1>
  <div class="sub" id="totals"></div>
  <div style="height:16px"></div>

  <div id="error" class="err hidden"></div>
  <div id="app"></div>

  <div class="footer">AUTOPILOT · AKTUALISIERT SICH JEDEN MORGEN VON SELBST 🛸</div>
</div>

<script>
const GOAL_F = 10000, GOAL_V = 100000;
const PLATFORMS = [
  {id:"tiktok", name:"TikTok", color:"var(--tiktok)"},
  {id:"youtube", name:"YouTube Shorts", color:"var(--youtube)"},
  {id:"instagram", name:"Instagram Reels", color:"var(--instagram)"},
];
const LS_KEY = "sfw-manual-views"; // { "2026-07-24": 52400, ... }

const nf = new Intl.NumberFormat("de-DE");
const fmt = n => (n==null||isNaN(n)) ? "–" : nf.format(n);
const fmtC = n => {
  if(n==null||isNaN(n)) return "–";
  const a = Math.abs(n);
  if(a>=1e6) return (n/1e6).toLocaleString("de-DE",{maximumFractionDigits:1})+" Mio.";
  if(a>=1e4) return (n/1e3).toLocaleString("de-DE",{maximumFractionDigits:1})+"k";
  return nf.format(n);
};
const dShort = iso => new Date(iso+"T00:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const dNice  = iso => new Date(iso+"T00:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"});
const today = () => { const d=new Date(),p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); };
const days = (a,b) => Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);

let ENTRIES = [], METRIC = "f";

function manualViews(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }

// data.json-Eintraege + manuelle TikTok-Views zu einer Zeitreihe verbinden
function series(){
  const mv = manualViews();
  const map = {};
  for(const e of ENTRIES){
    map[e.date] = {
      date: e.date,
      tiktok:{ f:e.tiktok&&e.tiktok.f!=null?e.tiktok.f:null,
               l:e.tiktok&&e.tiktok.l!=null?e.tiktok.l:null,
               v:null },
      youtube:{ f:e.youtube&&e.youtube.f!=null?e.youtube.f:null,
                v:e.youtube&&e.youtube.v!=null?e.youtube.v:null },
      instagram:{ f:e.instagram&&e.instagram.f!=null?e.instagram.f:null, v:null },
    };
  }
  for(const d in mv){
    if(!map[d]) map[d] = {date:d, tiktok:{f:null,l:null,v:null}, youtube:{f:null,v:null}, instagram:{f:null,v:null}};
    map[d].tiktok.v = mv[d];
  }
  return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
}

const get = (e,p,k) => (e&&e[p]&&e[p][k]!=null) ? e[p][k] : null;
// letzter bekannter Wert (falls ein Abruf mal ausfiel)
function lastVal(S,p,k){ for(let i=S.length-1;i>=0;i--){ const v=get(S[i],p,k); if(v!=null) return {v:v,date:S[i].date}; } return null; }
function prevVal(S,p,k,beforeDate){
  let seen=false;
  for(let i=S.length-1;i>=0;i--){
    const v=get(S[i],p,k);
    if(v==null) continue;
    if(!seen){ if(S[i].date===beforeDate){seen=true;continue;} seen=true; continue; }
    return v;
  }
  return null;
}
function chip(delta,compact){
  if(delta==null) return "";
  const cls = delta>0?"up":(delta<0?"down":"zero");
  const txt = delta===0?"±0":(delta>0?"▲ +":"▼ −")+(compact?fmtC(Math.abs(delta)):fmt(Math.abs(delta)));
  return '<span class="chip '+cls+'">'+txt+"</span>";
}

function render(){
  const S = series();
  const app = document.getElementById("app");
  if(!S.length){
    app.innerHTML = '<div class="card" style="text-align:center;padding:28px">'+
      '<div style="font-size:40px;margin-bottom:10px">🛸</div>'+
      '<div style="font-family:Montserrat;font-weight:800;font-size:16px;margin-bottom:6px">Noch keine Daten an Bord</div>'+
      '<div style="color:var(--dim);font-size:13px;line-height:1.5">Starte auf GitHub einmal den Workflow '+
      '(Actions → „Zahlen aktualisieren“ → Run workflow). Ab morgen läuft alles von selbst.</div></div>';
    return;
  }

  // Kopfzeile
  const ttF = lastVal(S,"tiktok","f"), ytF = lastVal(S,"youtube","f"), igF = lastVal(S,"instagram","f");
  const ytV = lastVal(S,"youtube","v"), ttV = lastVal(S,"tiktok","v"), ttL = lastVal(S,"tiktok","l");
  let totF = 0, anyF=false; [ttF,ytF,igF].forEach(x=>{ if(x){ totF+=x.v; anyF=true; } });
  let totV = 0, anyV=false; [ttV,ytV].forEach(x=>{ if(x){ totV+=x.v; anyV=true; } });
  document.getElementById("totals").innerHTML =
    "Gesamt: <b>"+(anyF?fmt(totF):"–")+"</b> Follower · <b>"+(anyV?fmtC(totV):"–")+"</b> Views";

  // Mission 10k
  const f = ttF ? ttF.v : null;
  const pctF = f!=null ? Math.min(100, f/GOAL_F*100) : 0;
  let paceTxt = "";
  const fp = S.filter(e=>get(e,"tiktok","f")!=null);
  if(fp.length>=2 && f!=null && f<GOAL_F){
    const cutoff = Date.now()-30*864e5;
    const win = fp.filter(e=>new Date(e.date+"T00:00:00").getTime()>=cutoff);
    const use = win.length>=2 ? win : fp;
    const a=use[0], b=use[use.length-1], dd=days(a.date,b.date);
    if(dd>0){
      const g=(get(b,"tiktok","f")-get(a,"tiktok","f"))/dd;
      if(g>0){
        const t=new Date(); t.setDate(t.getDate()+Math.ceil((GOAL_F-f)/g));
        paceTxt = ' · Tempo <b>+'+Math.round(g)+'/Tag</b> · 10k ≈ <b class="y" style="color:var(--yellow)">'+
          t.toLocaleDateString("de-DE",{day:"numeric",month:"short"})+"</b>";
      }
    }
  }

  // 100k Views / 30 Tage (aus manuellen TikTok-Views)
  let v30 = null;
  const vp = S.filter(e=>get(e,"tiktok","v")!=null);
  if(vp.length>=2){
    const last = vp[vp.length-1];
    const cut = new Date(last.date+"T00:00:00").getTime()-30*864e5;
    let base=null;
    for(const e of vp){ if(new Date(e.date+"T00:00:00").getTime()<=cut) base=e; }
    if(!base) base=vp[0];
    if(base!==last){ const d=get(last,"tiktok","v")-get(base,"tiktok","v"); if(d>=0) v30=d; }
  }
  const pctV = v30!=null ? Math.min(100, v30/GOAL_V*100) : 0;

  let html = "";
  html += '<div class="card mission"><div class="eyebrow y">Mission · Creator Rewards</div>'+
    '<div class="row"><span class="lbl">Follower → 10k</span>'+
    '<span class="val">'+fmt(f)+' <small>/ 10.000</small></span></div>'+
    '<div class="bar"><div class="fill" style="background:var(--yellow);width:'+pctF+'%"></div>'+
    '<span class="rocket" style="left:calc('+pctF+'% - 10px)">🚀</span></div>'+
    '<div class="note">'+Math.round(pctF)+' % geschafft'+paceTxt+'</div>'+
    '<div class="divider"></div>'+
    '<div class="row"><span class="lbl">TikTok-Views · letzte 30 Tage → 100k</span>'+
    '<span class="val">'+(v30!=null?fmtC(v30):"–")+' <small>/ 100k</small></span></div>'+
    '<div class="bar"><div class="fill" style="background:var(--tiktok);width:'+pctV+'%"></div></div>'+
    '<div class="note">'+(v30==null
      ? 'TikTok zeigt Gesamt-Views nicht öffentlich – trag sie 1×/Woche unten ein (aus TikTok Studio).'
      : 'Aus deinen wöchentlichen Einträgen berechnet.')+'</div></div>';

  // Plattform-Karten
  for(const pl of PLATFORMS){
    const lv = lastVal(S,pl.id,"f");
    const cur = lv?lv.v:null;
    const dF = cur!=null ? (prevVal(S,pl.id,"f",lv.date)!=null ? cur-prevVal(S,pl.id,"f",lv.date) : null) : null;
    const lvv = lastVal(S,pl.id,"v");
    const curV = lvv?lvv.v:null;
    const dV = curV!=null ? (prevVal(S,pl.id,"v",lvv.date)!=null ? curV-prevVal(S,pl.id,"v",lvv.date) : null) : null;
    const likes = pl.id==="tiktok" && ttL ? '<span class="likes">❤️ '+fmtC(ttL.v)+' Likes</span>' : "";
    const stale = lv && lv.date!==S[S.length-1].date ? ' <small style="color:var(--faint)">(Stand '+dNice(lv.date)+')</small>' : "";
    html += '<div class="card" style="padding:14px 16px">'+
      '<div class="phead"><span class="dot" style="background:'+pl.color+';box-shadow:0 0 8px '+pl.color+'"></span>'+
      '<span class="pname">'+pl.name+'</span>'+likes+'</div>'+
      '<div class="cols"><div class="col"><div class="klbl">Follower</div>'+
      '<div class="big">'+fmt(cur)+'</div>'+stale+'<div>'+chip(dF)+'</div></div>'+
      '<div class="vline"></div>'+
      '<div class="col"><div class="klbl">Views</div>'+
      '<div class="big">'+fmtC(curV)+'</div><div>'+chip(dV,true)+'</div></div></div></div>';
  }

  // TikTok-Views eintragen (localStorage)
  html += '<div class="card" id="viewsCard"><div class="eyebrow">TikTok-Views eintragen (1×/Woche)</div>'+
    '<div style="display:flex;gap:8px"><input id="mvDate" type="date" style="color-scheme:dark" value="'+today()+'">'+
    '<input id="mvVal" inputmode="numeric" placeholder="Views gesamt"></div>'+
    '<button class="btn" style="margin-top:10px;padding:12px" onclick="saveViews()">Speichern</button>'+
    '<div class="note">Aus TikTok Studio → Analytics. Wird nur auf diesem Handy gespeichert.</div></div>';

  // Chart
  if(S.length>=2){
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div class="eyebrow" style="margin-bottom:10px">Verlauf</div>'+
      '<div class="tabs" style="margin-bottom:10px">'+
      '<button class="tab '+(METRIC==="f"?"on":"")+'" onclick="setMetric(\'f\')">Follower</button>'+
      '<button class="tab '+(METRIC==="v"?"on":"")+'" onclick="setMetric(\'v\')">Views</button>'+
      '</div></div>'+svgChart(S)+'</div>';
  }

  // Letzte Eintraege
  html += '<div class="card"><div class="eyebrow">Letzte Einträge</div>';
  const rev=[...S].reverse().slice(0,6);
  for(const e of rev){
    let sf=0,af=false, sv=0,av=false;
    for(const pl of PLATFORMS){
      const x=get(e,pl.id,"f"); if(x!=null){sf+=x;af=true;}
      const y=get(e,pl.id,"v"); if(y!=null){sv+=y;av=true;}
    }
    html += '<div class="hist"><span class="d">'+dShort(e.date)+'</span>'+
      '<span style="flex:1"><b>'+(af?fmt(sf):"–")+'</b> <span style="color:var(--faint)">F</span> · '+
      '<b>'+(av?fmtC(sv):"–")+'</b> <span style="color:var(--faint)">V</span></span></div>';
  }
  html += '</div>';

  app.innerHTML = html;
}

function svgChart(S){
  const W=380,H=170,P=14;
  const pts = S.slice(-60);
  let min=Infinity,max=-Infinity;
  for(const pl of PLATFORMS) for(const e of pts){
    const v=get(e,pl.id,METRIC); if(v!=null){ if(v<min)min=v; if(v>max)max=v; }
  }
  if(!isFinite(min)) return '<div class="note">Noch keine Daten für diese Ansicht.</div>';
  if(min===max){min-=1;max+=1;}
  const X=i=>P+(W-2*P)*(pts.length===1?0.5:i/(pts.length-1));
  const Y=v=>H-P-(H-2*P)*((v-min)/(max-min));
  let out='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  const cmap={tiktok:"#25F4EE",youtube:"#FF5A5A",instagram:"#F06292"};
  for(const pl of PLATFORMS){
    let d="",started=false;
    pts.forEach((e,i)=>{
      const v=get(e,pl.id,METRIC);
      if(v==null) return;
      d+=(started?" L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);
      started=true;
    });
    if(started) out+='<path d="'+d+'" fill="none" stroke="'+cmap[pl.id]+'" stroke-width="2" stroke-linecap="round"/>';
  }
  out+='<text x="'+P+'" y="'+(H-2)+'" font-size="9" fill="#5A6383">'+dShort(pts[0].date)+'</text>';
  out+='<text x="'+(W-P)+'" y="'+(H-2)+'" font-size="9" fill="#5A6383" text-anchor="end">'+dShort(pts[pts.length-1].date)+'</text>';
  out+='</svg>';
  return out;
}

function setMetric(m){ METRIC=m; render(); }
function saveViews(){
  const d=document.getElementById("mvDate").value;
  const v=parseInt(String(document.getElementById("mvVal").value).replace(/[^\d]/g,""),10);
  if(!d||isNaN(v)){ alert("Bitte Datum und Zahl eingeben."); return; }
  const mv=manualViews(); mv[d]=v;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(mv)); }catch(e){}
  render();
}

(async function(){
  try{
    const res = await fetch("data.json?t="+Date.now());
    if(!res.ok) throw new Error("data.json nicht gefunden");
    const data = await res.json();
    ENTRIES = Array.isArray(data.entries)?data.entries:[];
    if(data.updated){
      const u=new Date(data.updated);
      document.getElementById("stand").textContent =
        "Stand: "+u.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+
        ", "+u.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    }
  }catch(e){
    const el=document.getElementById("error");
    el.textContent="Daten konnten nicht geladen werden ("+e.message+"). "+
      "Lief der Workflow schon einmal? GitHub: Actions → „Zahlen aktualisieren“ → Run workflow.";
    el.classList.remove("hidden");
  }
  render();
})();
</script>
</body>
</html>
